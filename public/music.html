<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Заказ музыки</title>
<link rel="stylesheet" href="music-skins.css?v=3">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif}
#wrap{position:absolute;inset:0;opacity:0;transition:opacity .5s}
#wrap.on{opacity:1}
#clip{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;border-radius:calc(var(--u)*.5);overflow:hidden}
#box{position:relative;flex:1;min-height:0;background:#000}
#box #yt,#box iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.ln{flex:none;height:calc(var(--u)*2.6);box-sizing:border-box;padding:0 calc(var(--u)*.8);display:none;align-items:center;background:#0d0d10;color:#fff;font-size:calc(var(--u)*1.35);font-weight:700;overflow:hidden;white-space:nowrap}
.ln.show{display:flex}
.ln em{font-style:normal;opacity:.65;font-weight:500}
.ln .ic{flex:none;margin-right:calc(var(--u)*.6);opacity:.8}
.ln .w{overflow:hidden;flex:1;min-width:0}
/* бегущая строка у клипа */
.w.run span{animation:mqs var(--d,12s) linear infinite}
body.pl #clip{inset:auto;left:0;top:0;width:200px;height:113px;opacity:.01;pointer-events:none;z-index:-1}
body.pl .ln{display:none!important}
#pw{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
body.pl #pw{display:flex}
#pl{transform-origin:center center;flex:none}
body.pv #wrap{opacity:1}
body.pv.off #wrap{opacity:.45}
body.pv #yt{background:repeating-linear-gradient(45deg,#1b1b20,#1b1b20 14px,#222228 14px,#222228 28px)}
</style></head><body>
<div id="wrap">
  <div id="clip">
    <div class="ln" id="lnTop"></div>
    <div id="box"><div id="yt"></div></div>
    <div class="ln" id="lnBot"></div>
  </div>
  <div id="pw"><div id="pl"></div></div>
</div>
<script src="music-skins.js?v=1"></script>
<script src="music.js?v=3"></script>
</body></html>
