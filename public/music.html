<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Заказ музыки</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;font-family:Inter,Segoe UI,Arial,sans-serif}
#box{position:absolute;opacity:0;transition:opacity .5s;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--ac),0 10px 40px rgba(0,0,0,.55)}
#box.on{opacity:1}
#box iframe,#box #yt{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#bar{position:absolute;opacity:0;transition:opacity .5s;display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:12px;background:rgba(10,6,8,.86);color:#fff;border-left:5px solid var(--ac);box-sizing:border-box;overflow:hidden}
#bar.on{opacity:1}
#bar b{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#bar span{font-size:20px;color:#ffffffb0;white-space:nowrap}
#bar i{font-style:normal;font-size:20px;color:var(--ac);font-weight:800;letter-spacing:.1em}
body.pv #box{opacity:1;background:repeating-linear-gradient(45deg,#1b1013,#1b1013 14px,#221419 14px,#221419 28px)}
body.pv #box::after{content:"КЛИП";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffffff90;font-size:44px;font-weight:800;letter-spacing:.2em}
body.pv #yt{display:none}
body.pv #box.off{opacity:.45}
</style></head><body>
<div id="stage"><div id="box"><div id="yt"></div></div><div id="bar"><i>♪</i><b id="ttl"></b><span id="by"></span></div></div>
<script src="music.js?v=1"></script>
</body></html>
