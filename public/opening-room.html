<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Overdeck — комната</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1344px;height:768px;transform-origin:0 0}
#stage>*{position:absolute}
.L{left:0;top:0;pointer-events:none}
#base{width:1344px;height:768px}
#win{left:0;top:118px;width:170px;height:394px;overflow:hidden;-webkit-mask:url(opening-room/space_mask.png) 0 0/100% 100%;mask:url(opening-room/space_mask.png) 0 0/100% 100%}
#win img{position:absolute;left:0;top:0;width:170px;height:394px}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(14px,-10px) scale(1.07)}}
#win canvas{position:absolute;left:0;top:0;width:170px;height:394px}
#signoff{left:556px;top:105px;width:309px;height:157px;animation:fl 9s steps(1) infinite}
@keyframes fl{0%{opacity:0}2%{opacity:1}3%{opacity:0}4.5%{opacity:1}6%{opacity:0}7%{opacity:1}8%{opacity:0}9%{opacity:0}9.5%{opacity:0}
 10%{opacity:0}11%{opacity:0}12%{opacity:0}
 13%,60%{opacity:0}61%{opacity:1}62%{opacity:0}63%{opacity:1}64%{opacity:0}65%,100%{opacity:0}}
#signglow{left:556px;top:105px;width:309px;height:157px;mix-blend-mode:screen;animation:br 4s ease-in-out infinite alternate}
@keyframes br{from{opacity:.15}to{opacity:.55}}
#led{width:1344px;height:768px;mix-blend-mode:screen;animation:pl 3.2s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.15}to{opacity:.7}}
.spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ringp{animation:rp 2.4s ease-in-out infinite alternate}@keyframes rp{from{opacity:.2}to{opacity:.9}}
#fring{animation:rp 2.4s ease-in-out infinite alternate}
.led1{animation:bl 1.6s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:.1}}
.dots circle{animation:bl 1.3s steps(1) infinite}.dots circle:nth-child(2){animation-duration:.7s}.dots circle:nth-child(3){animation-duration:2.1s}.dots circle:nth-child(4){animation-duration:.9s;animation-delay:.3s}.dots circle:nth-child(5){animation-duration:1.7s}.dots circle:nth-child(6){animation-duration:.5s}
#glow1,#glow2{width:1344px;height:768px;mix-blend-mode:screen}
#glow1{background:radial-gradient(ellipse 330px 210px at 580px 440px,rgba(200,185,255,.48),rgba(150,120,255,.2) 45%,transparent 75%);animation:gl 5s ease-in-out infinite alternate}
#glow2{background:radial-gradient(ellipse 170px 120px at 360px 450px,rgba(170,150,230,.14),transparent 75%)}
@keyframes gl{from{opacity:.75}to{opacity:1}}
.scr{overflow:hidden;transform-origin:0 0;background:#050204;color:#ffd9d0;font-family:'Segoe UI',Arial,sans-serif}
.scr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 40%);pointer-events:none}

.scr .glass{display:none}

@keyframes in{to{opacity:1}}
.slot{position:absolute;width:56px;height:72px;transform:translate(-50%,-100%);display:flex;align-items:flex-end;justify-content:center}
.slot img{max-width:100%;max-height:100%;filter:drop-shadow(0 0 8px var(--g,#f33))}
body.debug .slot{outline:1px dashed rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
</style></head><body>
<div id="stage">
 <img id="base" class="L" src="opening-room/base.jpg">
 <div id="win" class="L"><img src="opening-room/space.jpg"><canvas id="st" width="170" height="394"></canvas></div>
 <img id="signglow" class="L" src="opening-room/sign_glow.png">
 <img id="signoff" class="L" src="opening-room/sign_off.png">
<svg id="pc" class="L" width="1344" height="768" viewBox="0 0 1344 768" style="mix-blend-mode:screen">
 <defs><radialGradient id="fg"><stop offset="0" stop-color="#ff3a22" stop-opacity=".0"/><stop offset=".7" stop-color="#ff3a22" stop-opacity=".25"/><stop offset="1" stop-color="#ff5a3a" stop-opacity=".0"/></radialGradient></defs>
 <circle id="fring" cx="705" cy="646" r="26" fill="url(#fg)"/>
 <g transform="translate(705 646)"><g class="spin">
  <path d="M0 -3 C8 -6 14 -12 12 -17 C8 -13 3 -10 0 -3Z" fill="#ff4a30" opacity=".4"/>
  <path d="M0 -3 C8 -6 14 -12 12 -17 C8 -13 3 -10 0 -3Z" fill="#ff4a30" opacity=".4" transform="rotate(120)"/>
  <path d="M0 -3 C8 -6 14 -12 12 -17 C8 -13 3 -10 0 -3Z" fill="#ff4a30" opacity=".4" transform="rotate(240)"/></g>
  <circle r="18" fill="none" stroke="#ff4a30" stroke-width="1" class="ringp"/></g>
 <circle class="led1" cx="730" cy="615" r="2.2" fill="#ff3020"/>
 <g class="dots"><circle cx="694" cy="683" r="1.3" fill="#ff5a40"/><circle cx="701" cy="683" r="1.3" fill="#ffb040"/><circle cx="708" cy="683" r="1.3" fill="#ff5a40"/><circle cx="715" cy="683" r="1.3" fill="#ff8040"/><circle cx="694" cy="691" r="1.3" fill="#ffb040"/><circle cx="708" cy="691" r="1.3" fill="#ff5a40"/></g>
</svg>
 <img id="led" class="L" src="opening-room/led.png">
 <div id="glow1" class="L"></div><div id="glow2" class="L"></div>
 <div id="side" class="scr"><div class="glass"></div></div>
 <div id="main" class="scr"><div class="glass"></div></div>
 <div id="slots"></div>
</div>
<script>
const Q=new URLSearchParams(location.search), $=id=>document.getElementById(id);
if(Q.get('debug'))document.body.classList.add('debug');
function fit(){const k=[innerWidth/1344,innerHeight/768];$('stage').style.transform=`scale(${k[0]},${k[1]})`}
addEventListener('resize',fit);fit();
// экраны: аффинная привязка по трём углам
function homog(w,h,q){ // q: TL,TR,BR,BL -> matrix3d
 const src=[[0,0],[w,0],[w,h],[0,h]],A=[],B=[];
 for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v)}
 for(let c=0;c<8;c++){let m=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];[B[c],B[m]]=[B[m],B[c]];
  for(let r=0;r<8;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];B[r]-=f*B[c]}}
 const x=B.map((b,i)=>b/A[i][i]);
 return `matrix3d(${x[0]},${x[3]},0,${x[6]},${x[1]},${x[4]},0,${x[7]},0,0,1,0,${x[2]},${x[5]},0,1)`}
function place(el,w,h,q){el.style.width=w+'px';el.style.height=h+'px';el.style.left=0;el.style.top=0;el.style.transform=homog(w,h,q)}
place($('main'),538,270,[[446,359],[715,355],[715,494],[446,488]]);
place($('side'),304,194,[[284,396],[436,395],[436,491],[284,493]]);
// контент мониторов: большой — Twitch-плеер канала, малый — чат (?chat=URL), иначе тёмный
const ch=Q.get('channel')||'starlkov',par=Q.get('parent')||location.hostname||'localhost';
function frame(host,src){const f=document.createElement('iframe');f.src=src;f.allow='autoplay';f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#000';host.prepend(f)}
if(Q.get('twitch')!=='0')frame($('main'),`https://player.twitch.tv/?channel=${encodeURIComponent(ch)}&parent=${encodeURIComponent(par)}&muted=true&autoplay=true`);
if(Q.get('chat'))frame($('side'),Q.get('chat'));
// звёзды и кометы (без увеличения окна)
const cv=$('st'),cx=cv.getContext('2d');const S=Array.from({length:90},()=>({x:Math.random()*170,y:Math.random()*394,r:Math.random()*1.1+.3,p:Math.random()*6,v:.6+Math.random()*2.4}));let C=[];
function spawn(){const big=Math.random()<.3;C.push({x:60+Math.random()*130,y:Math.random()*220,vx:-(2.2+Math.random()*2),vy:1+Math.random()*1.2,l:0,len:big?70:38,w:big?2:1.3,hue:Math.random()<.5?'#fff':'#ffd9b0'})}
let last=0;(function f(t){if(t-last<33){requestAnimationFrame(f);return}last=t;cx.clearRect(0,0,170,394);const k=t/1000;
 for(const s of S){cx.globalAlpha=.2+.8*Math.pow(Math.abs(Math.sin(k*s.v+s.p)),2);cx.fillStyle='#fff';cx.fillRect(s.x,s.y,s.r*1.6,s.r*1.6)}
 if(Math.random()<.025&&C.length<3)spawn();
 C=C.filter(c=>{c.x+=c.vx;c.y+=c.vy;c.l+=.018;const n=Math.hypot(c.vx,c.vy),dx=c.vx/n,dy=c.vy/n;
  cx.globalAlpha=Math.max(0,1-c.l);const g=cx.createLinearGradient(c.x,c.y,c.x-dx*c.len,c.y-dy*c.len);g.addColorStop(0,c.hue);g.addColorStop(1,'rgba(255,255,255,0)');
  cx.strokeStyle=g;cx.lineWidth=c.w;cx.lineCap='round';cx.beginPath();cx.moveTo(c.x,c.y);cx.lineTo(c.x-dx*c.len,c.y-dy*c.len);cx.stroke();
  cx.globalAlpha=Math.max(0,1-c.l);cx.fillStyle='#fff';cx.beginPath();cx.arc(c.x,c.y,c.w*.8,0,7);cx.fill();return c.l<1});
 requestAnimationFrame(f)})(0);
// слоты на полках: 6 досок × 3 слота
const boards=[[150,75],[245,195],[340,313],[441,441],[530,560],[625,715]];
const X0=865,X1=1240,cols=[930,1050,1170];const slots=[];
boards.forEach((b,i)=>cols.forEach((x,j)=>{const y=b[0]+(b[1]-b[0])*(x-X0)/(X1-X0)+16;const d=document.createElement('div');d.className='slot';d.style.left=x+'px';d.style.top=y+'px';d.dataset.n=slots.length+1;$('slots').appendChild(d);slots.push(d)}));
window.OpeningScene={setSlot(n,url,o){const d=slots[n-1];if(!d)return;d.innerHTML='';const im=new Image();im.src=url;if(o&&o.glow)d.style.setProperty('--g',o.glow);d.appendChild(im)},clearSlot(n){const d=slots[n-1];if(d)d.innerHTML=''},count:slots.length};
(Q.get('slots')||'').split(',').filter(Boolean).forEach((u,i)=>OpeningScene.setSlot(i+1,u));
</script></body></html>
