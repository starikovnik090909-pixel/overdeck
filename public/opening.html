<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Overdeck — заставка «Комната стримера»</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Заставка-открытие стрима: анимированная комната стримера (источник «Браузер» 1920×1080).
  Параметры в адресе (все необязательные):
    ?title=СКОРО НАЧНЁМ   — крупная надпись на правом мониторе
    ?sub=стрим начнётся через   — подпись под ней
    ?minutes=10           — таймер обратного отсчёта на мониторе (0 — без таймера)
    ?mood=sunset|night|neon   — настроение: закат, ночь, неон
    ?accent=%23ff3b5c     — цвет неона/подсветки (по умолчанию от настроения или темы ?ostyle=)
  Полки — «слоты» для предметов: window.OpeningScene.setSlot(1..8, 'url.png') / clearSlot(n).
-->
<style>
  html, body { margin: 0; height: 100%; background: #0d0a14; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  svg { display: block; width: 1920px; height: 1080px; }
  canvas#fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; mix-blend-mode: screen; }
  text { font-family: 'Roboto Condensed', 'Inter', system-ui, sans-serif; }
  #cam { transform-origin: 960px 640px; animation: breathe 14s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(1) translate(0,0); } to { transform: scale(1.018) translate(-6px,-4px); } }
  .flick { animation: flick 5.5s steps(1) infinite; }
  @keyframes flick { 0%,100%{opacity:1} 41%{opacity:1} 42%{opacity:.55} 43%{opacity:1} 44%{opacity:.7} 45%{opacity:1} 78%{opacity:1} 79%{opacity:.6} 80%{opacity:1} }
  .scrfl { opacity: .04; animation: scrfl 3.2s steps(1) infinite; }
  @keyframes scrfl { 0%,100%{opacity:.03} 30%{opacity:.07} 31%{opacity:.02} 60%{opacity:.05} 85%{opacity:.08} }
  .pulse { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  .sway { animation: sway 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
  .sway2 { animation-duration: 8s; animation-delay: -3s; }
  .scroll-y { animation: scrolly 9s linear infinite; }
  @keyframes scrolly { from { transform: translateY(0); } to { transform: translateY(-120px); } }
  .drift1 { animation: drift 160s linear infinite; }
  .drift2 { animation: drift 260s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-640px); } }
  .cloud { animation: cloud 90s linear infinite; }
  @keyframes cloud { from { transform: translateX(-200px); } to { transform: translateX(760px); } }
  .rgb { animation: rgb 6s linear infinite; }
  @keyframes rgb { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  .spin { animation: spin 2.2s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { animation: bar 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bar { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .slotbox { stroke: rgba(255,255,255,.0); }
</style>
</head>

<script>
(function () {
  const q = new URLSearchParams(location.search);
  const MOODS = {
    sunset: { wall1:'#3a2538', wall2:'#2b1c2e', floor1:'#4a2f33', floor2:'#2a1a22', sky1:'#3b2a6b', sky2:'#c4456e', sky3:'#ff9a55', sun:'#ffae5c', cloud:'#ffc9a0', screen:'#4aa6ff', rug:'#5b2b49', accent:'#ff3b7b', accent2:'#38c8ff', grade:'#ff8a5c' },
    night:  { wall1:'#161a33', wall2:'#10132a', floor1:'#231f38', floor2:'#12101f', sky1:'#0a0f2c', sky2:'#1d2a64', sky3:'#3b4f9a', sun:'#a9c4ff', cloud:'#8fa2e8', screen:'#4aa6ff', rug:'#1f2a5a', accent:'#5b8cff', accent2:'#b46bff', grade:'#4a6cff', stars: 1 },
    neon:   { wall1:'#2a1a4a', wall2:'#1a1038', floor1:'#2c1a4a', floor2:'#150a2a', sky1:'#1a0f4a', sky2:'#7a2bd6', sky3:'#ff4fb0', sun:'#ff7ad9', cloud:'#ffa0e6', screen:'#38e0ff', rug:'#3b1f7a', accent:'#ff3dcb', accent2:'#38e0ff', grade:'#b46bff' },
  };
  const OSTYLE_ACCENT = { p: '#e22a22', b: '#44D62C', k: '#ff4655', o: '#fcee0a', c: '#38d0ff', f: '#5865F2', g: '#d9402e', h: '#0ac8b9' };
  const mood = MOODS[q.get('mood')] ? q.get('mood') : (q.get('ostyle') === 'p' ? 'night' : 'sunset');
  const m = Object.assign({}, MOODS[mood]);
  const os = q.get('ostyle');
  if (os && OSTYLE_ACCENT[os]) m.accent = OSTYLE_ACCENT[os];
  if (q.get('accent')) m.accent = q.get('accent');
  const root = document.documentElement.style;
  Object.keys(m).forEach((k) => root.setProperty('--' + k, m[k]));
  if (os === 'p') { root.setProperty('--wall1', '#1c1214'); root.setProperty('--wall2', '#120a0c'); root.setProperty('--floor1', '#241214'); root.setProperty('--floor2', '#120809'); root.setProperty('--sky1', '#12090a'); root.setProperty('--sky2', '#5a1210'); root.setProperty('--sky3', '#b3261e'); root.setProperty('--sun', '#ff4d3d'); root.setProperty('--rug', '#3a0f10'); root.setProperty('--accent2', '#ff8a5c'); root.setProperty('--grade', '#e22a22'); }

  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  // масштаб сцены под окно браузера
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); const st = $('stage'); st.style.transform = `scale(${s})`; st.style.left = ((innerWidth - 1920 * s) / 2) + 'px'; st.style.top = ((innerHeight - 1080 * s) / 2) + 'px'; }
  addEventListener('resize', fit); fit();

  // панели пола
  const pl = $('planks');
  for (let i = 0; i < 14; i++) { const y = 806 + Math.pow(i / 14, 1.5) * 274; mk('line', { x1: 0, y1: y, x2: 1920, y2: y, 'stroke-width': 2 }, pl); }
  for (let i = -6; i <= 26; i++) { const x = i * 100; mk('line', { x1: 960 + (x - 960) * 0.55, y1: 806, x2: 960 + (x - 960) * 1.5, y2: 1080, 'stroke-width': 2 }, pl); }

  // панели стены
  const wd = $('wallDecor');
  for (let x = 0; x < 1920; x += 160) mk('rect', { x, y: 130, width: 2, height: 666, fill: '#000', opacity: .25 }, wd);

  // город
  function city(g, base, hMin, hMax, wMin, wMax, col, lit) {
    let x = 1090; while (x < 1090 + 1300) { const w = wMin + rnd() * (wMax - wMin), h = hMin + rnd() * (hMax - hMin);
      mk('rect', { x, y: base - h, width: w, height: h, fill: col }, g);
      if (lit) for (let yy = base - h + 12; yy < base - 10; yy += 16) for (let xx = x + 6; xx < x + w - 8; xx += 12) if (rnd() > .62) mk('rect', { x: xx, y: yy, width: 5, height: 7, fill: rnd() > .5 ? '#ffd27a' : '#9fd8ff', opacity: .85 }, g);
      x += w + 2 + rnd() * 6; } }
  city($('cityFar'), 560, 60, 180, 30, 60, '#2a1d44', false);
  city($('cityNear'), 640, 80, 240, 36, 74, '#150f26', true);
  if (m.stars) { const st = $('stars'); st.setAttribute('opacity', 1); for (let i = 0; i < 60; i++) mk('circle', { cx: 1100 + rnd() * 590, cy: 140 + rnd() * 260, r: .6 + rnd() * 1.3, fill: '#fff', opacity: .4 + rnd() * .6 }, st); }

  // клавиши
  const keys = $('keys');
  for (let r = 0; r < 4; r++) for (let c = 0; c < 22; c++) { const x = 432 + c * 14.2 + r * 3, y = 743 + r * 4.4; mk('rect', { x, y, width: 11, height: 3, rx: 1 }, keys); }

  // лампочки гирлянды
  const bu = $('bulbs');
  for (let i = 0; i < 24; i++) { const x = 40 + i * 80, y = 92 + Math.sin(i * 0.9) * 8 + 8; const c = mk('circle', { cx: x, cy: y, r: 5, fill: i % 2 ? m.accent : m.accent2, class: 'pulse' }, bu); c.style.animationDelay = (-i * .35) + 's'; }

  // чат на левом мониторе
  const chat = $('chatL'); const lines = ['привет всем!', 'ну когда уже старт', 'GG', 'жду розыгрыш', 'тут уютно', 'звук норм?', 'о, началось', 'классная комната'];
  for (let i = 0; i < 16; i++) { const t = mk('text', { x: 534, y: 540 + i * 15, 'font-size': 10 }, chat); t.textContent = (i % 3 ? '▸ ' : '★ ') + lines[i % lines.length]; t.setAttribute('fill', i % 3 ? '#9db0f0' : m.accent); }
  mk('rect', { x: 530, y: 526, width: 98, height: 96, fill: 'none' }, chat);

  // слоты полок
  const SLOT_W = 96, SLOT_H = 120;
  const slotsG = $('slots'); const slots = {};
  [ [202, 'shelf1'], [352, 'shelf2'] ].forEach(([by, sh], row) => { for (let i = 0; i < 4; i++) { const n = row * 4 + i + 1; const x = 168 + i * 150, y = by - SLOT_H;
    const g = mk('g', { 'data-slot': n, transform: `translate(${x} ${y})` }, slotsG);
    mk('rect', { class: 'slotbox', width: SLOT_W, height: SLOT_H, fill: 'none' }, g);
    slots[n] = g; } });
  window.OpeningScene = {
    setSlot(n, url, opts) { const g = slots[n]; if (!g) return; this.clearSlot(n); opts = opts || {};
      const img = mk('image', { href: url, x: 0, y: 0, width: SLOT_W, height: SLOT_H, preserveAspectRatio: 'xMidYMax meet' }, g); img.setAttribute('class', 'slotimg');
      if (opts.glow) img.style.filter = `drop-shadow(0 0 12px ${opts.glow})`; },
    clearSlot(n) { const g = slots[n]; if (!g) return; g.querySelectorAll('.slotimg').forEach((e) => e.remove()); },
  };
  (q.get('slots') || '').split(',').forEach((u, i) => { if (u) window.OpeningScene.setSlot(i + 1, u); });

  // надписи и таймер
  if (q.get('title')) $('scrTitle').textContent = q.get('title');
  if (q.get('sub')) $('scrSub').textContent = q.get('sub');
  const minutes = q.has('minutes') ? Math.max(0, parseFloat(q.get('minutes'))) : 10;
  const endAt = Date.now() + minutes * 60000, tEl = $('scrTimer');
  function tick() { if (!minutes) { tEl.textContent = ''; $('scrSub').textContent = q.get('sub') || ''; return; } const left = Math.max(0, endAt - Date.now()); const mm = Math.floor(left / 60000), ss = Math.floor(left % 60000 / 1000); tEl.textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); }
  tick(); setInterval(tick, 500);

  // частицы: пыль в луче окна и светлячки
  const cv = $('fx'), cx = cv.getContext('2d');
  const P = []; for (let i = 0; i < 70; i++) P.push({ x: 700 + Math.random() * 1000, y: 200 + Math.random() * 760, r: .8 + Math.random() * 1.8, vx: -.06 - Math.random() * .12, vy: -.03 + Math.random() * .08, ph: Math.random() * 6.28, dust: Math.random() > .25 });
  function hex2rgb(h) { const c = h.replace('#', ''); const n = parseInt(c.length === 3 ? c.replace(/(.)/g, '$1$1') : c, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  const acc = hex2rgb(m.accent2);
  function loop(t) { requestAnimationFrame(loop); cx.clearRect(0, 0, 1920, 1080);
    P.forEach((p) => { p.x += p.vx + Math.sin(t / 2000 + p.ph) * .12; p.y += p.vy + Math.cos(t / 2600 + p.ph) * .08; if (p.x < 600) p.x = 1700; if (p.y < 140) p.y = 980; if (p.y > 1000) p.y = 160;
      const a = (.35 + .35 * Math.sin(t / 900 + p.ph)) * (p.dust ? .7 : 1);
      if (p.dust) { cx.fillStyle = `rgba(255,236,200,${a * .6})`; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); }
      else { const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7); g.addColorStop(0, `rgba(${acc[0]},${acc[1]},${acc[2]},${a})`); g.addColorStop(1, `rgba(${acc[0]},${acc[1]},${acc[2]},0)`); cx.fillStyle = g; cx.fillRect(p.x - p.r * 7, p.y - p.r * 7, p.r * 14, p.r * 14); } }); }
  requestAnimationFrame(loop);
})();
</script>
</body>
