<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Умная вебка — Overdeck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0b0c;--card:#141416;--line:#26262a;--fg:#f2f2f2;--mut:#8a8a90;--accent:#2BC4B4}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:13px system-ui,Segoe UI,sans-serif;overflow:hidden}
body.ui{background:var(--bg)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
body.ui #stage{right:300px;background:repeating-conic-gradient(#1b1b1e 0 25%,#141416 0 50%) 0 0/24px 24px}
canvas{max-width:100%;max-height:100%}
#panel{position:fixed;top:0;right:0;bottom:0;width:300px;background:var(--card);border-left:1px solid var(--line);padding:14px;display:none;flex-direction:column;gap:9px;overflow:auto}
body.ui #panel{display:flex}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}h1 b{color:var(--accent)}
label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
label span em{float:right;font-style:normal;color:var(--fg)}
select,input[type=color],button{background:#0e0e10;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit}
input[type=range]{accent-color:var(--accent)}button{cursor:pointer}button:hover{border-color:var(--accent)}
.row{display:flex;gap:6px}.row>*{flex:1}
#msg{color:var(--mut);font-size:12px;min-height:30px}#msg.err{color:#ff6b6b}
.url{font-size:11px;color:var(--mut);word-break:break-all;background:#0e0e10;border:1px solid var(--line);border-radius:7px;padding:6px 8px;user-select:all}
</style></head><body class="ui">
<div id="stage"><canvas id="out"></canvas></div>
<aside id="panel">
<h1>Умная <b>вебка</b></h1>
<div id="msg">Запуск…</div>
<label>Камера<select id="cam"></select></label>
<label>Фон<select id="mode">
<option value="transparent">Прозрачный (для OBS)</option><option value="blur">Размытие</option>
<option value="color">Цвет</option><option value="image">Своя картинка</option></select></label>
<label id="lColor">Цвет фона<input type="color" id="color" value="#2BC4B4"></label>
<div class="row" id="lImg" style="display:none"><button id="pick">Выбрать картинку…</button><input id="file" type="file" accept="image/*" hidden></div>
<label><span>Сила размытия <em id="vBlur"></em></span><input type="range" id="blur" min="2" max="40" value="16"></label>
<label><span>Порог (что считать человеком) <em id="vThr"></em></span><input type="range" id="thr" min="10" max="90" value="50"></label>
<label><span>Мягкость края <em id="vSoft"></em></span><input type="range" id="soft" min="0" max="40" value="12"></label>
<label><span>Сглаживание (меньше дрожи) <em id="vSm"></em></span><input type="range" id="sm" min="0" max="90" value="55"></label>
<label><span>Сжать контур <em id="vShr"></em></span><input type="range" id="shr" min="0" max="6" value="0"></label>
<label>Эффекты на лице<select id="fx">
<option value="off">Выкл</option><option value="red">Красные глаза</option><option value="fire">Горящие глаза</option>
<option value="veins">Вены вампира</option><option value="vamp">Вампир (глаза + вены)</option><option value="tomoe">Глаза с томое (красные)</option><option value="mask">Маска на пол-лица</option><option value="hair">Серебристые волосы</option><option value="ninja">Ниндзя (глаза + маска + волосы)</option><option value="bar">Чёрная полоса (аноним)</option></select></label>
<label id="lFxi"><span>Сила эффекта <em id="vFxi"></em></span><input type="range" id="fxi" min="10" max="100" value="70"></label>
<label id="lFxc">Цвет глаз/огня<input type="color" id="fxc" value="#ff1a1a"></label>
<div class="row"><button id="mirror">Зеркало: выкл</button><button id="fps">FPS: —</button></div>
<div style="color:var(--mut);font-size:11px">Ссылка для OBS (Источник → Браузер, 1280×720, без управления):</div>
<div class="url" id="url"></div>
<button id="copy">Скопировать ссылку</button>
</aside>
<script type="module">
import {ImageSegmenter,FaceLandmarker,FilesetResolver} from './vendor/vision_bundle.mjs';
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
const OBS=q.get('obs')==='1';
let fl=null,flP=null,pts=null,lost=0,parts=[],veinSet=null;
if(OBS)document.body.classList.remove('ui');
const DEF={mode:'transparent',color:'#2BC4B4',blur:16,thr:50,soft:12,sm:55,shr:0,mirror:0,cam:'',fx:'off',fxi:70,fxc:'#ff1a1a'};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('webcam')||'{}'))}catch(e){}
for(const k of Object.keys(DEF)){if(q.has(k))S[k]=typeof DEF[k]==='number'?+q.get(k):q.get(k)}
const save=()=>{try{localStorage.setItem('webcam',JSON.stringify(S))}catch(e){}
 const u=new URLSearchParams({obs:1});for(const k of['mode','color','blur','thr','soft','sm','shr','mirror','fx','fxi','fxc'])u.set(k,S[k]);
 $('url').textContent=location.origin+location.pathname+'?'+u}
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'err':''};
const bind=(id,k,fmt)=>{const el=$(id);el.value=S[k];const f=()=>{S[k]=el.type==='range'?+el.value:el.value;if(fmt)$('v'+id[0].toUpperCase()+id.slice(1)).textContent=fmt(S[k]);save();ui()};el.oninput=f;f()};
function ui(){$('lFxi').style.display=$('lFxc').style.display=S.fx==='off'||S.fx==='bar'||S.fx==='mask'||S.fx==='hair'?'none':'';if(S.fx!=='off')ensureFace();$('lColor').style.display=S.mode==='color'?'':'none';$('lImg').style.display=S.mode==='image'?'':'none';$('mirror').textContent='Зеркало: '+(S.mirror?'вкл':'выкл')}
$('mode').value=S.mode;$('mode').onchange=()=>{S.mode=$('mode').value;save();ui()};
$('fx').value=S.fx;$('fx').onchange=()=>{S.fx=$('fx').value;save();ui()};bind('fxi','fxi',v=>v+'%');bind('fxc','fxc');bind('color','color');bind('blur','blur',v=>v+'px');bind('thr','thr',v=>v+'%');bind('soft','soft',v=>v);bind('sm','sm',v=>v+'%');bind('shr','shr',v=>v);
$('mirror').onclick=()=>{S.mirror=S.mirror?0:1;save();ui()};
$('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText($('url').textContent);$('copy').textContent='Скопировано'};
let bg=null;$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>bg=im;im.src=URL.createObjectURL(f)};
save();ui();

const out=$('out'),ctx=out.getContext('2d');
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;
const mask=document.createElement('canvas'),mctx=mask.getContext('2d');
const fg=document.createElement('canvas'),fctx=fg.getContext('2d');
const bl=document.createElement('canvas'),bctx=bl.getContext('2d');
let seg,stream,smooth=null,frames=0,lastT=performance.now(),lastVT=-1;

async function listCams(){try{const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');
 $('cam').innerHTML=d.map((x,i)=>`<option value="${x.deviceId}">${x.label||'Камера '+(i+1)}</option>`).join('');
 if(S.cam&&d.some(x=>x.deviceId===S.cam))$('cam').value=S.cam}catch(e){}}
async function startCam(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 const c={video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false};
 if(S.cam)c.video.deviceId={exact:S.cam};
 try{stream=await navigator.mediaDevices.getUserMedia(c)}catch(e){
  if(S.cam){S.cam='';return startCam()}
  throw e}
 vid.srcObject=stream;await vid.play();
 out.width=fg.width=bl.width=vid.videoWidth;out.height=fg.height=bl.height=vid.videoHeight;smooth=null;
 await listCams();
}
$('cam').onchange=async()=>{S.cam=$('cam').value;save();try{await startCam()}catch(e){msg('Камера: '+e.message,1)}};

function process(res){
 const m=res.confidenceMasks[0];const w=m.width,h=m.height;const f=m.getAsFloat32Array();
 if(mask.width!==w){mask.width=w;mask.height=h}
 if(!smooth||smooth.length!==f.length)smooth=new Float32Array(f);
 const a=S.sm/100,thr=S.thr/100,soft=Math.max(.001,S.soft/100);
 const img=mctx.createImageData(w,h),d=img.data;
 for(let i=0;i<f.length;i++){
  const v=smooth[i]=smooth[i]*a+f[i]*(1-a);
  let t=(v-(thr-soft))/(2*soft);t=t<0?0:t>1?1:t;t=t*t*(3-2*t);
  const o=i*4;d[o]=d[o+1]=d[o+2]=255;d[o+3]=t*255;
 }
 mctx.putImageData(img,0,0);m.close();
}
function draw(){
 const W=out.width,H=out.height;ctx.clearRect(0,0,W,H);
 ctx.save();if(S.mirror){ctx.translate(W,0);ctx.scale(-1,1)}
 // фон
 if(S.mode==='color'){ctx.fillStyle=S.color;ctx.fillRect(0,0,W,H)}
 else if(S.mode==='blur'){ctx.filter=`blur(${S.blur}px)`;ctx.drawImage(vid,-S.blur*2,-S.blur*2,W+S.blur*4,H+S.blur*4);ctx.filter='none'}
 else if(S.mode==='image'&&bg){const r=Math.max(W/bg.width,H/bg.height);const bw=bg.width*r,bh=bg.height*r;ctx.drawImage(bg,(W-bw)/2,(H-bh)/2,bw,bh)}
 // человек = кадр * маска
 fctx.globalCompositeOperation='copy';fctx.filter='none';fctx.drawImage(vid,0,0,W,H);
 fctx.globalCompositeOperation='destination-in';
 if(S.shr>0)fctx.filter=`blur(${S.shr}px) contrast(2)`;
 fctx.drawImage(mask,0,0,W,H);fctx.filter='none';fctx.globalCompositeOperation='source-over';
 ctx.drawImage(fg,0,0);fxDraw(performance.now());ctx.restore();
}

// ===== эффекты на лице =====
function ensureFace(){if(fl||flP)return flP;flP=(async()=>{const fs=await FilesetResolver.forVisionTasks('./vendor/wasm');
 const mk=d=>FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'./vendor/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1});
 try{fl=await mk('GPU')}catch(e){fl=await mk('CPU')}})().catch(e=>{msg('Эффекты: '+(e.message||e),1);flP=null});return flP}
const EYE_R=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],EYE_L=[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398];
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
function track(){
 if(!fl||S.fx==='off'){pts=null;return}
 let r;try{r=fl.detectForVideo(vid,performance.now())}catch(e){return}
 const L=r&&r.faceLandmarks&&r.faceLandmarks[0];const W=out.width,H=out.height;
 if(!L){if(++lost>6)pts=null;return}
 lost=0;const k=.55;
 if(!pts||pts.length!==L.length)pts=L.map(p=>({x:p.x*W,y:p.y*H}));
 else L.forEach((p,i)=>{pts[i].x+=(p.x*W-pts[i].x)*k;pts[i].y+=(p.y*H-pts[i].y)*k});
}
function rng(sd){return()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296}
function mkVeins(){const R=rng(7),out=[];
 const roots=[[.62,.02,.1],[-.62,.02,.1],[.95,-.25,-.3],[-.95,-.25,.3],[.4,.3,.5],[-.4,.3,-.5],[.85,.65,.7],[-.85,.65,-.7],[0,-.15,0],[.55,-.55,.15],[-.55,-.55,-.15],[.45,.8,.4],[-.45,.8,-.4]];
 function grow(x,y,a,len,w,depth){const seg=[];const n=Math.round(len*18);
  for(let i=0;i<n;i++){seg.push([x,y,w*(1-i/n*.8)]);a+=(R()-.5)*.45;x+=Math.cos(a)*.035;y+=Math.sin(a)*.035;
   if(depth<2&&i>4&&R()<.07)grow(x,y,a+(R()<.5?-1:1)*(.5+R()*.5),len*.55,w*.6,depth+1)}
  out.push(seg)}
 roots.forEach(([x,y,a0])=>{const n=2+(R()*2|0);for(let j=0;j<n;j++)grow(x,y,a0+(R()-.5)*2.4+(y>0?Math.PI/2:-Math.PI/2)*.6,.35+R()*.4,1,0)});
 return out}
function frame(){ // локальная система лица
 const a=pts[468],b=pts[473];if(!a||!b)return null;
 const ex=b.x-a.x,ey=b.y-a.y,D=Math.hypot(ex,ey)||1;
 return{ax:a.x,ay:a.y,bx:b.x,by:b.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,ux:ex/D,uy:ey/D,D}}
function irisR(c){let s=0;for(let i=1;i<=4;i++)s+=Math.hypot(pts[c+i].x-pts[c].x,pts[c+i].y-pts[c].y);return s/4}
function poly(ids){ctx.beginPath();ids.forEach((i,k)=>k?ctx.lineTo(pts[i].x,pts[i].y):ctx.moveTo(pts[i].x,pts[i].y));ctx.closePath()}
function eyes(F,t,fire){
 const I=S.fxi/100,col=S.fxc;
 [[468,EYE_R],[473,EYE_L]].forEach(([c,E])=>{
  const p=pts[c],r=irisR(c);
  // свечение
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(p.x,p.y,r*.3,p.x,p.y,r*(fire?4.5:3));
  g.addColorStop(0,col+(fire?'cc':'99'));g.addColorStop(1,col+'00');ctx.globalAlpha=I;ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(p.x,p.y,r*(fire?4.5:3),0,7);ctx.fill();ctx.restore();
  // радужка внутри века
  ctx.save();poly(E);ctx.clip();
  const fl2=fire?(.85+.15*Math.sin(t/60+c)):1;
  const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*1.25);
  g2.addColorStop(0,fire?'#fff6c0':col);g2.addColorStop(.45,col);g2.addColorStop(1,'#300');
  ctx.globalAlpha=Math.min(1,.35+I*.75)*fl2;ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,r*1.18,0,7);ctx.fill();
  ctx.globalAlpha=.85*I;ctx.fillStyle='#120000';ctx.beginPath();ctx.ellipse(p.x,p.y,r*.16,r*.55,0,0,7);ctx.fill();
  ctx.restore();
  if(fire)for(let i=0;i<Math.ceil(I*3);i++)parts.push({x:p.x+(Math.random()-.5)*r*1.6,y:p.y+(Math.random()-.5)*r,vx:(Math.random()-.5)*.8,vy:-(1.2+Math.random()*2.4)*F.D/90,life:1,s:F.D*(.05+Math.random()*.07)});
 })}
function flames(F){
 ctx.save();ctx.globalCompositeOperation='lighter';
 parts=parts.filter(q=>q.life>0);
 for(const q of parts){q.x+=q.vx+Math.sin(q.life*9+q.x)*.5;q.y+=q.vy;q.life-=.045;
  const rr=q.s*(.5+q.life);const g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr);
  g.addColorStop(0,`rgba(255,${180*q.life+60|0},${60*q.life|0},${.7*q.life*S.fxi/100})`);g.addColorStop(1,'rgba(255,40,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,7);ctx.fill()}
 ctx.restore()}
function veins(F,t){
 if(!veinSet)veinSet=mkVeins();
 const I=S.fxi/100,pulse=.8+.2*Math.sin(t/420);
 ctx.save();poly(OVAL);ctx.clip();
 ctx.globalCompositeOperation='multiply';ctx.lineCap='round';ctx.lineJoin='round';
 const px=(x,y)=>[F.cx+(x*F.ux-y*F.uy)*F.D,F.cy+(x*F.uy+y*F.ux)*F.D];
 for(const pass of[0,1])for(const sg of veinSet){
  ctx.beginPath();sg.forEach(([x,y],i)=>{const[X,Y]=px(x,y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});
  const w=sg[0][2];
  if(pass===0){ctx.strokeStyle=`rgba(70,10,60,${.5*I*pulse})`;ctx.lineWidth=F.D*.04*w}
  else{ctx.strokeStyle=`rgba(140,30,90,${.85*I*pulse})`;ctx.lineWidth=F.D*.018*w}
  ctx.stroke()}
 ctx.restore()}
function bar(F){
 const h=F.D*.5,w=F.D*2.5,ang=Math.atan2(F.uy,F.ux);
 ctx.save();ctx.translate(F.cx,F.cy);ctx.rotate(ang);ctx.fillStyle='#000';
 ctx.fillRect(-w/2,-h/2,w,h);ctx.restore()}

const JAW=[454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234];
function tomoe(F,t){
 const I=S.fxi/100,roll=Math.atan2(F.uy,F.ux);
 [[468,EYE_R],[473,EYE_L]].forEach(([c,E])=>{
  const p=pts[c],r=irisR(c)*1.2;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(p.x,p.y,r*.3,p.x,p.y,r*3);g.addColorStop(0,'#ff203099');g.addColorStop(1,'#ff203000');
  ctx.globalAlpha=I;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*3,0,7);ctx.fill();ctx.restore();
  ctx.save();poly(E);ctx.clip();
  const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g2.addColorStop(0,'#e01020');g2.addColorStop(1,'#a00010');
  ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  ctx.strokeStyle='#1a0004';ctx.lineWidth=r*.1;ctx.beginPath();ctx.arc(p.x,p.y,r*.58,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,p.y,r*.98,0,7);ctx.stroke();
  ctx.fillStyle='#120003';ctx.beginPath();ctx.arc(p.x,p.y,r*.2,0,7);ctx.fill();
  for(let k=0;k<3;k++){const a=roll-Math.PI/2+k*2.0944,cx=p.x+Math.cos(a)*r*.58,cy=p.y+Math.sin(a)*r*.58;
   ctx.beginPath();ctx.arc(cx,cy,r*.17,0,7);ctx.fill();
   ctx.beginPath();ctx.moveTo(cx,cy);ctx.quadraticCurveTo(cx+Math.cos(a+1.9)*r*.3,cy+Math.sin(a+1.9)*r*.3,cx+Math.cos(a+1.3)*r*.34,cy+Math.sin(a+1.3)*r*.34);
   ctx.lineWidth=r*.12;ctx.strokeStyle='#120003';ctx.stroke()}
  ctx.restore()})}
function faceMask(F){
 ctx.save();ctx.beginPath();
 [6,...JAW.slice().reverse().filter((_,i)=>false)].forEach(()=>{});
 const top=[454,447,6,227,234];
 JAW.forEach((i,k)=>k?ctx.lineTo(pts[i].x,pts[i].y):ctx.moveTo(pts[i].x,pts[i].y));
 top.slice(1).forEach(i=>ctx.lineTo(pts[i].x,pts[i].y));ctx.closePath();
 const g=ctx.createLinearGradient(pts[6].x,pts[6].y,pts[152].x,pts[152].y);g.addColorStop(0,'#1c2740');g.addColorStop(1,'#0d1322');
 ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='#2b3a5c';ctx.lineWidth=F.D*.025;ctx.lineJoin='round';ctx.stroke();
 ctx.globalAlpha=.5;ctx.strokeStyle='#3a4d78';ctx.lineWidth=F.D*.02;ctx.beginPath();ctx.moveTo(pts[168].x,pts[168].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.stroke();
 ctx.restore()}
function hair(F){
 const top=[234,127,162,21,54,103,67,109,10,338,297,332,284,251,389,356,454];
 const cx=pts[168].x,cy=pts[168].y;const R=rng(11);
 const up=pts[10];const outer=[],lower=[];
 top.forEach((i,k)=>{const p=pts[i];const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;
  const sp=k%2?.4:.1;const h=F.D*(.08+sp+R()*.12);
  outer.push([p.x+dx/d*h*.4,p.y+dy/d*h]);lower.push([p.x+dx/d*F.D*.05,p.y+dy/d*F.D*.06])});
 ctx.save();ctx.beginPath();
 outer.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 for(let i=lower.length-1;i>=0;i--)ctx.lineTo(lower[i][0],lower[i][1]);ctx.closePath();
 const g=ctx.createLinearGradient(up.x,up.y-F.D,up.x,up.y+F.D*.2);g.addColorStop(0,'#f2f4f8');g.addColorStop(1,'#a9b0bd');
 ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#7d8594';ctx.lineWidth=F.D*.015;ctx.lineJoin='miter';ctx.stroke();ctx.restore()}
function fxDraw(t){
 if(S.fx==='off'||!pts)return;const F=frame();if(!F)return;
 if(S.fx==='veins'||S.fx==='vamp')veins(F,t);
 if(S.fx==='red'||S.fx==='vamp')eyes(F,t,false);
 if(S.fx==='fire'){eyes(F,t,true);flames(F)}
 if(S.fx==='bar')bar(F)
 if(S.fx==='hair'||S.fx==='ninja')hair(F);
 if(S.fx==='mask'||S.fx==='ninja')faceMask(F);
 if(S.fx==='tomoe'||S.fx==='ninja')tomoe(F,t)}
function loop(){
 requestAnimationFrame(loop);
 if(!seg||vid.readyState<2||vid.currentTime===lastVT)return;lastVT=vid.currentTime;
 try{seg.segmentForVideo(vid,performance.now(),r=>{process(r)})}catch(e){msg('Ошибка: '+e.message,1);return}
 track();draw();frames++;const n=performance.now();
 if(n-lastT>1000){$('fps').textContent='FPS: '+Math.round(frames*1000/(n-lastT));frames=0;lastT=n}
}
(async()=>{
 try{
  msg('Загружаю модель…');
  const fs=await FilesetResolver.forVisionTasks('./vendor/wasm');
  const mk=d=>ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:'./vendor/seg.tflite',delegate:d},runningMode:'VIDEO',outputConfidenceMasks:true,outputCategoryMask:false});
  try{seg=await mk('GPU')}catch(e){seg=await mk('CPU')}
  msg('Просим камеру…');await startCam();
  msg('Работает. Прозрачный фон — в OBS поставь ссылку ниже.');
  window.__webcamReady=true;loop();
 }catch(e){msg((e.name==='NotAllowedError'?'Нет доступа к камере. Разреши её в браузере.':'Ошибка: '+(e.message||e)),1);console.error(e)}
})();
</script></body></html>
